<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Design Preferences Study</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #212529; line-height: 1.6; }
.container { max-width: 680px; margin: 0 auto; padding: 24px 20px; min-height: 100vh; }
.progress-bar { background: #e9ecef; border-radius: 8px; height: 6px; margin-bottom: 32px; overflow: hidden; }
.progress-fill { background: #4263eb; height: 100%; border-radius: 8px; transition: width 0.3s ease; }
.screen { display: none; }
.screen.active { display: block; }
h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; color: #495057; }
p { margin-bottom: 16px; color: #495057; }
.proposal-box { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px; margin-bottom: 24px; font-style: italic; color: #495057; }
.question-block { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.question-block h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
.question-counter { font-size: 0.8rem; color: #868e96; margin-bottom: 4px; }
.option { display: block; padding: 10px 14px; margin-bottom: 6px; border: 2px solid #e9ecef; border-radius: 6px; cursor: pointer; transition: all 0.15s; font-size: 0.95rem; }
.option:hover { border-color: #4263eb; background: #f0f3ff; }
.option.selected { border-color: #4263eb; background: #e8ecff; }
.option input { display: none; }
.option-label { display: inline; }
.btn { display: inline-block; padding: 12px 32px; background: #4263eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: #3b5bdb; }
.btn:disabled { background: #adb5bd; cursor: not-allowed; }
.btn-row { margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px; }
.completion-code { background: #d3f9d8; border: 1px solid #69db7c; border-radius: 8px; padding: 16px; text-align: center; font-size: 1.2rem; font-weight: 600; font-family: monospace; margin: 24px 0; }
.note { font-size: 0.85rem; color: #868e96; margin-top: 8px; }
.required { color: #e03131; }
.error-msg { color: #e03131; font-size: 0.85rem; margin-top: 4px; display: none; }
@media (max-width: 600px) {
  .container { padding: 16px 12px; }
}
</style>
</head>
<body>
<div class="container">
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
<div id="screens"></div>
</div>

<script>
const STUDY_DATA = {"personal-website":{"label":"Personal Website","proposal":"I want a personal website to showcase my projects, skills, and a contact form. It should look polished, be easy to update, and work well on phones and desktops. I'd like the option to add a blog later.","questions":[{"id":"Q17","question":"How many projects should the site showcase at launch?","options":[{"label":"A","text":"2\u20133 of your absolute best"},{"label":"B","text":"5\u20138 projects covering a range of work"},{"label":"C","text":"Everything you've worked on, regardless of count"},{"label":"D","text":"A curated set of 3\u20135 with a note that more are available on request"}]},{"id":"Q21","question":"Should project case studies include the process (problem, approach, result)?","options":[{"label":"A","text":"Yes, every project should follow a structured case study format"},{"label":"B","text":"Yes, but only for 2\u20133 flagship projects"},{"label":"C","text":"No, just show the final result with a brief description"},{"label":"D","text":"Include a brief \"challenge and outcome\" summary, skipping detailed process"}]},{"id":"Q30","question":"Where should submitted contact form messages be delivered?","options":[{"label":"A","text":"Directly to your personal email inbox"},{"label":"B","text":"To a dedicated email address for the site"},{"label":"C","text":"To a simple admin dashboard on the site"},{"label":"D","text":"To both email and a notification in a messaging app (e.g., Slack, Telegram)"}]},{"id":"Q47","question":"Should the site include an \"Experience\" or work history section separate from projects?","options":[{"label":"A","text":"Yes, a timeline of roles and companies"},{"label":"B","text":"No, let projects and skills speak for themselves"},{"label":"C","text":"A brief \"Currently at [Company]\" mention in the About section"},{"label":"D","text":"Yes, integrated with projects so each role shows associated work"}]},{"id":"Q56","question":"How should the site handle SEO?","options":[{"label":"A","text":"Basic SEO: proper page titles, meta descriptions, and headings"},{"label":"B","text":"Comprehensive SEO including structured data, sitemap, optimized images, and social meta tags"},{"label":"C","text":"SEO focused primarily on your name and brand terms"},{"label":"D","text":"Minimal SEO; rely on direct links and social sharing for traffic"}]},{"id":"Q67","question":"Should the site have a print-friendly stylesheet?","options":[{"label":"A","text":"Yes, a dedicated print layout"},{"label":"B","text":"No, the downloadable resume covers print needs"},{"label":"C","text":"Basic print cleanup (hide nav, fix colors) without a full redesign"},{"label":"D","text":"No print consideration"}]},{"id":"Q68","question":"What should happen when a visitor scrolls back to the top of the page?","options":[{"label":"A","text":"A \"back to top\" button appears after scrolling down"},{"label":"B","text":"Clicking the site logo or name scrolls to the top"},{"label":"C","text":"Both a back-to-top button and logo-click behavior"},{"label":"D","text":"Nothing special; visitors scroll manually"}]},{"id":"Q73","question":"Should the site display any metrics or stats (e.g., years of experience, projects completed, clients served)?","options":[{"label":"A","text":"Yes, in a prominent counter/stats section"},{"label":"B","text":"Yes, woven into section descriptions naturally"},{"label":"C","text":"No metrics"},{"label":"D","text":"Yes, but only on the About page rather than the homepage"}]},{"id":"Q78","question":"Who is the primary audience for this site?","options":[{"label":"A","text":"Potential employers or recruiters"},{"label":"B","text":"Potential clients or collaborators"},{"label":"C","text":"Peers and the professional community"},{"label":"D","text":"A general audience including all of the above"}]},{"id":"Q80","question":"What should the overall tone and voice of the site's written content be?","options":[{"label":"A","text":"Formal and professional"},{"label":"B","text":"Casual and conversational"},{"label":"C","text":"Concise and no-nonsense"},{"label":"D","text":"Warm and enthusiastic"},{"label":"E","text":"Witty and personality-driven"}]}]},"personal-mobileapp":{"label":"Expense Tracker App","proposal":"I want a mobile app for tracking daily expenses. I need to quickly log an amount and category, see spending breakdowns by week or month, set budget limits with alerts, and export data as CSV. Cloud sync would be ideal.","questions":[{"id":"Q6","question":"Should expense logging support adding a photo (e.g., of a receipt)?","options":[{"label":"A","text":"Yes, as an optional field on the add screen"},{"label":"B","text":"Yes, but only accessible after saving the expense (as an \"attach\" action)"},{"label":"C","text":"No, keep it out of scope"},{"label":"D","text":"Yes, with automatic OCR to pre-fill the amount and category"}]},{"id":"Q19","question":"What time periods should the charts support?","options":[{"label":"A","text":"Week and month only"},{"label":"B","text":"Week, month, and year"},{"label":"C","text":"Custom date range picker"},{"label":"D","text":"Week, month, year, and custom range"}]},{"id":"Q40","question":"How should cloud sync work from the user's perspective?","options":[{"label":"A","text":"Automatic and invisible"},{"label":"B","text":"Automatic with a visible sync status indicator"},{"label":"C","text":"Manual sync triggered by the user"},{"label":"D","text":"Automatic sync with an option to force a manual sync"}]},{"id":"Q45","question":"Should the app support sharing expense data with another person (e.g., a partner or roommate)?","options":[{"label":"A","text":"Yes, full shared accounts where both users see and log expenses"},{"label":"B","text":"Yes, read-only sharing of reports or summaries"},{"label":"C","text":"No, keep it strictly personal"},{"label":"D","text":"Export-based sharing only (send CSV or a screenshot)"}]},{"id":"Q58","question":"Should the app support widgets on the home screen (iOS/Android)?","options":[{"label":"A","text":"Yes, a small widget showing today's total and budget remaining"},{"label":"B","text":"Yes, a quick-add widget that opens the add expense screen in one tap"},{"label":"C","text":"Yes, both an info widget and a quick-add widget"},{"label":"D","text":"No widgets at launch"}]},{"id":"Q71","question":"Should the app support multiple budget profiles or scenarios?","options":[{"label":"A","text":"Yes, let users switch between profiles (e.g., \"travel mode\" vs. \"normal month\")"},{"label":"B","text":"No, one budget configuration at a time"},{"label":"C","text":"Allow temporary budget overrides for specific months without changing the default"},{"label":"D","text":"Yes, with templates the user can save and reapply"}]},{"id":"Q72","question":"Should the app provide any end-of-month summary or report?","options":[{"label":"A","text":"Yes, an automatic push notification with a visual monthly summary"},{"label":"B","text":"Yes, a generated report available in-app at month's end"},{"label":"C","text":"Yes, both a notification and a detailed in-app report"},{"label":"D","text":"No, the dashboard and charts serve this purpose"}]},{"id":"Q75","question":"Should the app allow users to set financial goals beyond budget limits (e.g., \"save $500 this month\")?","options":[{"label":"A","text":"Yes, a full goal-tracking feature with progress visualization"},{"label":"B","text":"Yes, but limited to a single savings target"},{"label":"C","text":"No, goals are outside the scope of an expense tracker"},{"label":"D","text":"Show how much is \"left over\" relative to income minus budgeted expenses"}]},{"id":"Q76","question":"Should the app work in landscape orientation?","options":[{"label":"A","text":"Yes, full landscape support with adapted layouts"},{"label":"B","text":"Portrait only"},{"label":"C","text":"Landscape support only for charts and reports"},{"label":"D","text":"Follow the device rotation setting but with a portrait-optimized layout"}]},{"id":"Q80","question":"What should the app's data deletion/account closure process look like?","options":[{"label":"A","text":"A single \"Delete all my data\" button in settings with a confirmation dialog"},{"label":"B","text":"A multi-step process: request deletion, receive a confirmation email, then data is purged after 14 days"},{"label":"C","text":"Export data first (forced), then delete"},{"label":"D","text":"Immediate local deletion with a 30-day cloud retention window for recovery"}]}]},"personal-finance":{"label":"Personal Finance Dashboard","proposal":"I want a web dashboard that connects to my bank accounts, auto-categorizes transactions, and shows spending trends with charts. I need monthly budgets per category, a net worth tracker, and alerts for unusual spending.","questions":[{"id":"Q3","question":"How often should connected account data be refreshed?","options":[{"label":"A","text":"Real-time or near-real-time (every few minutes)"},{"label":"B","text":"Once daily (e.g., overnight sync)"},{"label":"C","text":"On-demand only (user clicks \"refresh\")"},{"label":"D","text":"Multiple times per day on a schedule (e.g., every 4 hours)"}]},{"id":"Q14","question":"Should budgets roll over unused amounts to the next month?","options":[{"label":"A","text":"Yes, unused budget rolls over automatically"},{"label":"B","text":"No, each month starts fresh"},{"label":"C","text":"User chooses per category whether to roll over"},{"label":"D","text":"Unused amounts are tracked and shown as \"savings\" but don't increase next month's budget"}]},{"id":"Q18","question":"How should the savings rate forecast work?","options":[{"label":"A","text":"A simple linear projection based on average monthly savings"},{"label":"B","text":"A projection with user-adjustable assumptions (income changes, planned expenses, savings goals)"},{"label":"C","text":"Multiple scenario projections shown side by side (optimistic, current trend, pessimistic)"},{"label":"D","text":"A goal-based forecast (\"At this rate, you'll reach $X by [date]\")"}]},{"id":"Q22","question":"How should \"unusual transaction\" detection work?","options":[{"label":"A","text":"Flag any transaction above a user-defined dollar threshold"},{"label":"B","text":"Flag transactions that deviate significantly from the user's historical spending patterns"},{"label":"C","text":"Flag both high-value transactions and pattern deviations"},{"label":"D","text":"No automated detection; user reviews transactions manually"}]},{"id":"Q31","question":"What should the primary color/visual theme of the dashboard be?","options":[{"label":"A","text":"Light/white with accent colors for data"},{"label":"B","text":"Dark mode by default"},{"label":"C","text":"User's choice with a toggle between light and dark"},{"label":"D","text":"A calming, muted palette (soft blues/greens)"}]},{"id":"Q35","question":"Should users be able to add notes or tags to individual transactions?","options":[{"label":"A","text":"Yes, free-text notes on any transaction"},{"label":"B","text":"Yes, a tagging system with user-created tags"},{"label":"C","text":"Both notes and tags"},{"label":"D","text":"No annotations"}]},{"id":"Q36","question":"How should the dashboard handle pending (uncleared) transactions?","options":[{"label":"A","text":"Show them inline with a \"pending\" badge"},{"label":"B","text":"Show them in a separate \"pending\" section"},{"label":"C","text":"Hide pending transactions until they clear"},{"label":"D","text":"Include pending amounts in budget calculations but visually distinguish them"}]},{"id":"Q38","question":"How should the dashboard handle transactions that fail to categorize automatically?","options":[{"label":"A","text":"Place them in an \"Uncategorized\" bucket and let the user sort them when convenient"},{"label":"B","text":"Prompt the user to categorize them in a batch review screen"},{"label":"C","text":"Assign them to the best-guess category but flag them for review"},{"label":"D","text":"Exclude them from budget calculations until categorized"}]},{"id":"Q61","question":"What kind of welcome/empty state should new users see for budgets?","options":[{"label":"A","text":"Pre-populated suggested budgets based on national averages"},{"label":"B","text":"A prompt to set budgets manually with category guidance"},{"label":"C","text":"No budgets set; just show spending without limits until the user chooses to create budgets"},{"label":"D","text":"Budgets auto-generated from the user's first month of imported data"}]},{"id":"Q65","question":"Should the dashboard include a bill calendar or upcoming payments view?","options":[{"label":"A","text":"Yes, a calendar showing expected upcoming bills and their amounts"},{"label":"B","text":"Yes, a simple list of upcoming bills in the next 7\u201314 days"},{"label":"C","text":"No, bill tracking is separate from spending analysis"},{"label":"D","text":"Yes, integrated into the forecast feature to show projected account balances after upcoming bills"}]}]},"healthcare-telehealth":{"label":"Telehealth Platform","proposal":"I want a telehealth platform for video visits between patients and providers. Patients check in, verify identity, and join a video call. Providers can take notes and annotate during the visit. The system generates a post-visit summary with care instructions.","questions":[{"id":"Q4","question":"How should the platform handle insurance verification?","options":[{"label":"A","text":"Real-time eligibility check against payer databases at check-in"},{"label":"B","text":"Patient uploads insurance card images and staff verifies manually before the visit"},{"label":"C","text":"Patient self-reports insurance details and the system flags discrepancies for staff review"},{"label":"D","text":"Integration with a third-party insurance verification service that runs automatically"}]},{"id":"Q10","question":"How should screen sharing work during a visit?","options":[{"label":"A","text":"Only the provider can share their screen"},{"label":"B","text":"Either party can share their screen with a toggle"},{"label":"C","text":"Provider shares by default; patient can request to share, and the provider approves"},{"label":"D","text":"Provider shares a specific application or window rather than full screen"}]},{"id":"Q12","question":"Should annotations made during the visit be saved?","options":[{"label":"A","text":"Yes, automatically saved and attached to the visit record"},{"label":"B","text":"Yes, but only if the provider explicitly chooses to save"},{"label":"C","text":"No, annotations are ephemeral and disappear after the call"},{"label":"D","text":"Saved and included in the post-visit summary sent to the patient"}]},{"id":"Q13","question":"How should structured note-taking work for providers during the visit?","options":[{"label":"A","text":"A standardized SOAP note template (Subjective, Objective, Assessment, Plan)"},{"label":"B","text":"Customizable templates that providers or practices can configure per visit type"},{"label":"C","text":"Free-form rich text with optional structured fields"},{"label":"D","text":"AI-assisted transcription that auto-populates structured fields from the conversation"}]},{"id":"Q18","question":"What should the post-visit summary include?","options":[{"label":"A","text":"Diagnoses, care instructions, and prescriptions only"},{"label":"B","text":"Everything in (A) plus a plain-language explanation of what was discussed"},{"label":"C","text":"Everything in (B) plus links to educational resources related to the diagnosis"},{"label":"D","text":"A brief overview with the option to view a detailed version"}]},{"id":"Q21","question":"How should the secure messaging system be structured?","options":[{"label":"A","text":"A single ongoing thread per patient-provider relationship"},{"label":"B","text":"Separate threads per topic or visit"},{"label":"C","text":"A ticketing system where each message becomes a trackable request"},{"label":"D","text":"A unified inbox with tagging and filtering"}]},{"id":"Q37","question":"Should patient feedback be visible to other patients?","options":[{"label":"A","text":"Yes, show aggregate ratings and written reviews on provider profiles"},{"label":"B","text":"Yes, but only aggregate ratings (no written comments)"},{"label":"C","text":"No, feedback is private and only visible to the provider and practice administrators"},{"label":"D","text":"Visible only after a minimum number of reviews (e.g., 10+) to prevent outlier bias"}]},{"id":"Q49","question":"Should the platform support walk-in or urgent-care-style visits without prior scheduling?","options":[{"label":"A","text":"Yes, as a core feature with a real-time queue"},{"label":"B","text":"Yes, but only during designated \"open hours\" set by providers"},{"label":"C","text":"No, all visits must be scheduled in advance"},{"label":"D","text":"Yes, with automatic triage questions to determine urgency before joining the queue"}]},{"id":"Q57","question":"Should the platform support asynchronous (store-and-forward) visits in addition to live video?","options":[{"label":"A","text":"Yes, patients can submit photos, symptoms, and questions for provider review without a live call"},{"label":"B","text":"No, all visits should be live video to ensure quality of care"},{"label":"C","text":"Yes, but only for specific visit types like dermatology or follow-ups"},{"label":"D","text":"Yes, and the provider can decide to escalate to a live call if needed after reviewing the submission"}]},{"id":"Q58","question":"How should the platform handle multiple languages?","options":[{"label":"A","text":"English only at launch"},{"label":"B","text":"Multi-language interface with professionally translated content"},{"label":"C","text":"English interface with on-demand interpreter service integration for visits"},{"label":"D","text":"Auto-translated interface with the option to request human interpretation during visits"}]}]},"startup-scheduling":{"label":"Scheduling Platform","proposal":"I'm building an appointment scheduling platform for service businesses. Customers browse available slots, book, and get reminders. Businesses customize their services, pricing, and staff schedules. Calendar sync prevents double-booking.","questions":[{"id":"Q6","question":"What information should be required from the customer to complete a booking?","options":[{"label":"A","text":"Name and email only"},{"label":"B","text":"Name, email, and phone number"},{"label":"C","text":"Let each business configure which fields are required vs. optional"},{"label":"D","text":"Name, email, and a free-text notes field"}]},{"id":"Q7","question":"How should the platform handle time zones?","options":[{"label":"A","text":"Always display times in the business's local time zone"},{"label":"B","text":"Auto-detect the customer's time zone and display accordingly"},{"label":"C","text":"Show both the business's time zone and a converted local time"}]},{"id":"Q12","question":"When should appointment reminders be sent?","options":[{"label":"A","text":"24 hours before only"},{"label":"B","text":"24 hours and 1 hour before"},{"label":"C","text":"Let the business configure reminder timing"},{"label":"D","text":"Smart reminders based on appointment value or history"}]},{"id":"Q14","question":"How should the business dashboard's home screen be organized?","options":[{"label":"A","text":"A chronological list of today's upcoming appointments"},{"label":"B","text":"A weekly calendar view with key stats (bookings, revenue) in a sidebar"},{"label":"C","text":"A summary card layout: today's count, week's revenue, next appointment"},{"label":"D","text":"Let businesses customize their dashboard layout"}]},{"id":"Q20","question":"How should the platform handle a staff member calling in sick or taking unplanned time off?","options":[{"label":"A","text":"The business marks the staff member as unavailable, and all affected customers are automatically notified and asked to rebook"},{"label":"B","text":"The business marks unavailability and can reassign appointments to other available staff"},{"label":"C","text":"The business marks unavailability, and the system auto-reassigns to qualified available staff"},{"label":"D","text":"Just let the business cancel appointments manually one by one"}]},{"id":"Q33","question":"How should the MVP onboarding flow work for a new business signing up?","options":[{"label":"A","text":"A guided wizard that walks through each setup step (services, schedule, branding)"},{"label":"B","text":"Drop them into the dashboard with a checklist of setup tasks"},{"label":"C","text":"Pre-fill with smart defaults based on business type and let them adjust"},{"label":"D","text":"A minimal setup: just name and one service to go live, with everything else optional"}]},{"id":"Q36","question":"Should the platform support walk-in tracking (non-online bookings)?","options":[{"label":"A","text":"Yes, staff can manually add walk-ins to the schedule"},{"label":"B","text":"No, only track online bookings"},{"label":"C","text":"Allow manual bookings but visually distinguish them from online ones"}]},{"id":"Q55","question":"How should recurring appointments work when eventually added?","options":[{"label":"A","text":"The customer books once and it auto-repeats on the same day/time weekly or monthly"},{"label":"B","text":"The system suggests the next recurring slot, but the customer confirms each time"},{"label":"C","text":"The business sets up recurring bookings on behalf of the customer"},{"label":"D","text":"Flexible recurrence rules (every N weeks, specific days, end date)"}]},{"id":"Q64","question":"Should the dashboard include a customer management section (CRM-lite)?","options":[{"label":"A","text":"Yes, a basic customer list with booking history and contact info"},{"label":"B","text":"No, just show customer info within individual booking records"},{"label":"C","text":"Yes, with notes, tags, and preferences per customer"},{"label":"D","text":"Not in MVP, but plan to add it"}]},{"id":"Q67","question":"Should businesses be notified about upcoming schedule gaps or low-booking periods?","options":[{"label":"A","text":"Yes, proactive alerts like \"You have 5 open slots tomorrow\""},{"label":"B","text":"No, just display availability on the dashboard and let them notice"},{"label":"C","text":"Yes, with suggestions (e.g., \"Share your booking link to fill gaps\")"}]}]}};

// Leave empty for local testing — responses will download as JSON files instead.
const SUBMIT_ENDPOINT = "https://script.google.com/macros/s/AKfycbxsNyb0sLdVr5trHK0OvCzEcoXrhfQSRSVBa9UHo0_F2V9MQlUn_WRQwPsWDuuqN0fa/exec";

const state = {
  participantId: crypto.randomUUID(),
  startTime: Date.now(),
  traits: {},
  project: null,
  specSource: null,
  feedback: {},
  reqChecks: {},
};

const projectKeys = Object.keys(STUDY_DATA);
state.project = projectKeys[Math.floor(Math.random() * projectKeys.length)];
state.specSource = Math.random() < 0.5 ? "buddy" : "gemini";
const proj = STUDY_DATA[state.project];

const SCREENS = [];

function addScreen(id, html) {
  SCREENS.push({ id, html });
}

addScreen("consent", `
  <h1>Software Design Preferences Study</h1>
  <p>Answer questions about your preferences when planning a software project. Takes about <strong>3&ndash;5 minutes</strong>.</p>
  <p style="font-size:0.9rem; color:#868e96;">Responses are anonymous and used for academic research. You may exit at any time.</p>
  <div class="btn-row"><button class="btn" onclick="nextScreen()">Start</button></div>
`);

addScreen("traits", `
  <h2>About You</h2>

  <div class="question-block">
    <div class="question-counter">Question 1 of 5</div>
    <h3>Which best describes your experience with building software or digital products?</h3>
    <label class="option" onclick="selectTrait(this,'experience','beginner')"><span class="option-label">I'm new to this / learning</span></label>
    <label class="option" onclick="selectTrait(this,'experience','junior_engineer')"><span class="option-label">I've built a few things but still developing skills</span></label>
    <label class="option" onclick="selectTrait(this,'experience','pm_founder')"><span class="option-label">I lead product decisions / define what gets built</span></label>
    <label class="option" onclick="selectTrait(this,'experience','senior_engineer')"><span class="option-label">I've shipped and maintained production systems for years</span></label>
    <label class="option" onclick="selectTrait(this,'experience','designer')"><span class="option-label">I focus on how things look and feel for users</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 2 of 5</div>
    <h3>When planning a new app, what matters most to you?</h3>
    <label class="option" onclick="selectTrait(this,'priorities','privacy_first')"><span class="option-label">Keeping my data private and secure</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','speed_simplicity')"><span class="option-label">Making it simple and fast to use</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','feature_rich')"><span class="option-label">Packing in powerful features</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','low_cost')"><span class="option-label">Keeping costs low</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 3 of 5</div>
    <h3>When someone asks for your input on design decisions, you tend to...</h3>
    <label class="option" onclick="selectTrait(this,'engagement','highly_engaged')"><span class="option-label">Give detailed feedback and push back on things I disagree with</span></label>
    <label class="option" onclick="selectTrait(this,'engagement','moderately_engaged')"><span class="option-label">Give reasonable input but don't overthink it</span></label>
    <label class="option" onclick="selectTrait(this,'engagement','passive')"><span class="option-label">Go with whatever seems fine, I trust the builder</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 4 of 5</div>
    <h3>When you start a project, how clear is your vision?</h3>
    <label class="option" onclick="selectTrait(this,'goal_clarity','clear_target')"><span class="option-label">I know exactly what I want</span></label>
    <label class="option" onclick="selectTrait(this,'goal_clarity','problem_first')"><span class="option-label">I know the problem but I'm flexible on the solution</span></label>
    <label class="option" onclick="selectTrait(this,'goal_clarity','exploratory')"><span class="option-label">I'm exploring &mdash; I'll figure it out as I go</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 5 of 5</div>
    <h3>How do you prefer to work with tools or assistants?</h3>
    <label class="option" onclick="selectTrait(this,'collaboration','solo')"><span class="option-label">I work best alone, just give me the tools</span></label>
    <label class="option" onclick="selectTrait(this,'collaboration','small_group')"><span class="option-label">I like collaborating with a small team or partner</span></label>
    <label class="option" onclick="selectTrait(this,'collaboration','large_group')"><span class="option-label">I'm used to coordinating across many people</span></label>
  </div>

  <div id="traits-error" class="error-msg">Please answer all 5 questions before continuing.</div>
  <div class="btn-row"><button class="btn" onclick="validateTraits()">Continue</button></div>
`);

addScreen("preference_check", ``);

addScreen("requirement_check", ``);

addScreen("thanks", `
  <h1>Thank you!</h1>
  <p>Your responses have been recorded. Here is your completion code:</p>
  <div class="completion-code" id="completion-code"></div>
  <p class="note">Please copy this code and paste it back in Prolific to confirm your participation.</p>
`);

let currentScreen = 0;

function render() {
  const container = document.getElementById("screens");
  container.innerHTML = SCREENS.map((s, i) =>
    `<div class="screen ${i === currentScreen ? "active" : ""}" id="screen-${s.id}">${s.html}</div>`
  ).join("");
  const pct = (currentScreen / (SCREENS.length - 1)) * 100;
  document.getElementById("progress").style.width = pct + "%";
  window.scrollTo(0, 0);
  restoreSelections();
}

function restoreSelections() {
  document.querySelectorAll('.option').forEach(el => {
    const oc = el.getAttribute('onclick') || '';
    for (const [dim, val] of Object.entries(state.traits)) {
      if (oc.includes("selectTrait") && oc.includes("'" + dim + "'") && oc.includes("'" + val + "'"))
        el.classList.add("selected");
    }
    for (const [key, val] of Object.entries(state.feedback)) {
      if (oc.includes("selectFeedback") && oc.includes("'" + key + "'") && oc.includes("'" + val + "'"))
        el.classList.add("selected");
    }
    for (const [key, val] of Object.entries(state.reqChecks)) {
      if (oc.includes("selectReqCheck") && oc.includes("'" + key + "'") && oc.includes("'" + val + "'"))
        el.classList.add("selected");
    }
  });
}

function nextScreen() {
  currentScreen++;
  render();
}

function prevScreen() {
  if (currentScreen > 0) {
    currentScreen--;
    render();
  }
}

function selectTrait(el, dim, val) {
  const block = el.closest(".question-block");
  block.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.traits[dim] = val;
}

function selectFeedback(el, key, val) {
  const block = el.closest(".question-block");
  block.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.feedback[key] = val;
}

function selectReqCheck(el, key, val) {
  const block = el.closest(".question-block");
  block.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.reqChecks[key] = val;
}

function showPreferenceCheck() {
  let bestPid = null, bestDist = 999;
  for (const [pid, pt] of Object.entries(PERSONA_TRAITS)) {
    let dist = 0;
    for (const dim of ["experience","priorities","engagement","goal_clarity","collaboration"]) {
      if (state.traits[dim] !== pt[dim]) dist++;
    }
    if (dist < bestDist) { bestDist = dist; bestPid = pid; }
  }
  state.closestPersona = bestPid;
  state.closestDistance = bestDist;
  const personaAns = (PERSONA_ANSWERS[bestPid] || {})[state.project] || {};
  const proj = STUDY_DATA[state.project];
  const candidates = proj.questions.filter(q => personaAns[q.id]);
  const selected = candidates.slice(0, 10);
  let html = `<h2>Part 1: AI Preference Check</h2>
    <p>For this project (<strong>${proj.label}</strong>), we asked an AI to role-play a user with similar traits and answer design questions. Do you agree with its choices?</p>
    <div class="proposal-box">${proj.proposal}</div>
    <p class="note">Skip any question you don't have a strong opinion on.</p>`;
  selected.forEach((q, i) => {
    const aiChoice = personaAns[q.id];
    const optionsHtml = q.options.map(o => {
      const isAI = o.label === aiChoice;
      return `<div style="padding:8px 14px;margin-bottom:4px;border-radius:6px;font-size:0.95rem;${
        isAI ? 'background:#e8ecff;border:1px solid #bac8ff;font-weight:600;' : 'color:#495057;'
      }">(${o.label}) ${o.text}${isAI ? ' &larr; AI chose this' : ''}</div>`;
    }).join("");
    html += `<div class="question-block">
      <div class="question-counter">${i+1} of ${selected.length}</div>
      <h3>${q.question}</h3>
      <div style="margin-bottom:12px;">${optionsHtml}</div>
      <label class="option" onclick="selectFeedback(this,'judge_${q.id}','agree')"><span class="option-label">Agree &mdash; I'd pick the same</span></label>
      <label class="option" onclick="selectFeedback(this,'judge_${q.id}','disagree')"><span class="option-label">Disagree &mdash; I'd choose differently</span></label>
      <label class="option" onclick="selectFeedback(this,'judge_${q.id}','no_opinion')"><span class="option-label">No strong opinion</span></label>
    </div>`;
  });
  if (selected.length === 0) {
    html += `<p>No comparable AI responses available.</p>`;
  }
  html += `<div class="btn-row"><button class="btn" onclick="showRequirementCheck()">Continue</button></div>`;
  const idx = SCREENS.findIndex(s => s.id === "preference_check");
  if (idx >= 0) SCREENS[idx].html = html;
  nextScreen();
}

function showRequirementCheck() {
  const proj = STUDY_DATA[state.project];
  const specSet = SPEC_DATA[state.project];
  if (!specSet) { nextScreen(); return; }
  const spec = specSet[state.specSource];
  if (!spec) { nextScreen(); return; }

  const bulletsHtml = spec.bullets.map(b =>
    `<div style="padding:5px 0;border-bottom:1px solid #f1f3f5;font-size:0.93rem;">&bull; ${b}</div>`
  ).join("");

  let html = `<h2>Part 2: Specification Review</h2>
    <p>An AI assistant interviewed a user about <strong>${proj.label}</strong> and wrote a specification. First, read the full spec below. Then, for each of 5 key requirements, tell us whether the spec handles it adequately.</p>
    <div class="proposal-box">${proj.proposal}</div>
    <div class="question-block">
      <h3>AI-Generated Specification</h3>
      ${bulletsHtml}
    </div>
    <h2 style="margin-top:32px;">Does the spec handle these requirements?</h2>`;
  specSet.requirements.forEach((req, i) => {
    const excerpt = spec.excerpts[i] || "Not specified in this plan";
    html += `<div class="question-block">
      <div class="question-counter">Requirement ${i+1} of 5</div>
      <h3>${req}</h3>
      <div style="background:#f0f3ff;border:1px solid #bac8ff;border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:0.95rem;">
        <strong>What the spec says:</strong> ${excerpt}
      </div>
      <label class="option" onclick="selectReqCheck(this,'req_${i}','yes')"><span class="option-label">Yes, adequate</span></label>
      <label class="option" onclick="selectReqCheck(this,'req_${i}','no')"><span class="option-label">No, not adequate</span></label>
      <label class="option" onclick="selectReqCheck(this,'req_${i}','not_sure')"><span class="option-label">Not sure</span></label>
    </div>`;
  });
  html += `<div class="btn-row"><button class="btn" onclick="submitStudy()">Submit</button></div>`;

  const idx = SCREENS.findIndex(s => s.id === "requirement_check");
  if (idx >= 0) SCREENS[idx].html = html;
  nextScreen();
}

function validateTraits() {
  const dims = ["experience", "priorities", "engagement", "goal_clarity", "collaboration"];
  const missing = dims.filter(d => !state.traits[d]);
  const err = document.getElementById("traits-error");
  if (missing.length > 0) {
    err.style.display = "block";
    return;
  }
  err.style.display = "none";
  showPreferenceCheck();
}

function submitStudy() {
  state.endTime = Date.now();
  state.durationSeconds = Math.round((state.endTime - state.startTime) / 1000);

  const payload = {
    participant_id: state.participantId,
    timestamp: new Date().toISOString(),
    duration_seconds: state.durationSeconds,
    traits: state.traits,
    project: state.project,
    feedback: state.feedback,
    closest_persona: state.closestPersona || "",
    closest_distance: state.closestDistance != null ? state.closestDistance : -1,
    spec_source: state.specSource || "",
    req_checks: state.reqChecks,
  };

  const code = "SPEC-" + state.participantId.slice(0, 8).toUpperCase();

  if (SUBMIT_ENDPOINT) {
    fetch(SUBMIT_ENDPOINT, {
      method: "POST",
      body: JSON.stringify(payload),
    }).catch(() => {});
  } else {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `response_${state.participantId.slice(0,8)}.json`;
    a.click();
  }

  nextScreen();
  document.getElementById("completion-code").textContent = code;
}

render();
</script>
</body>
</html>
