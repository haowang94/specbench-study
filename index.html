<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Design Preferences Study</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #212529; line-height: 1.6; }
.container { max-width: 680px; margin: 0 auto; padding: 24px 20px; min-height: 100vh; }
.progress-bar { background: #e9ecef; border-radius: 8px; height: 6px; margin-bottom: 32px; overflow: hidden; }
.progress-fill { background: #4263eb; height: 100%; border-radius: 8px; transition: width 0.3s ease; }
.screen { display: none; }
.screen.active { display: block; }
h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; color: #495057; }
p { margin-bottom: 16px; color: #495057; }
.proposal-box { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px; margin-bottom: 24px; font-style: italic; color: #495057; }
.question-block { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.question-block h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
.question-counter { font-size: 0.8rem; color: #868e96; margin-bottom: 4px; }
.option { display: block; padding: 10px 14px; margin-bottom: 6px; border: 2px solid #e9ecef; border-radius: 6px; cursor: pointer; transition: all 0.15s; font-size: 0.95rem; }
.option:hover { border-color: #4263eb; background: #f0f3ff; }
.option.selected { border-color: #4263eb; background: #e8ecff; }
.option input { display: none; }
.option-label { display: inline; }
.btn { display: inline-block; padding: 12px 32px; background: #4263eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: #3b5bdb; }
.btn:disabled { background: #adb5bd; cursor: not-allowed; }
.btn-row { margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px; }
textarea { width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 6px; font-family: inherit; font-size: 0.95rem; resize: vertical; min-height: 80px; }
textarea:focus { outline: none; border-color: #4263eb; }
.completion-code { background: #d3f9d8; border: 1px solid #69db7c; border-radius: 8px; padding: 16px; text-align: center; font-size: 1.2rem; font-weight: 600; font-family: monospace; margin: 24px 0; }
.note { font-size: 0.85rem; color: #868e96; margin-top: 8px; }
.required { color: #e03131; }
.error-msg { color: #e03131; font-size: 0.85rem; margin-top: 4px; display: none; }
@media (max-width: 600px) {
  .container { padding: 16px 12px; }
}
</style>
</head>
<body>
<div class="container">
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
<div id="screens"></div>
</div>

<script>
const STUDY_DATA = {"personal-website":{"label":"Personal Website","proposal":"I want to build a personal website that I can use to showcase my work, share a bit about myself, and give people a way to get in touch. It should look polished and professional, with sections for my projects, skills, and a contact form. I'd like it to be easy to update without needing to redeploy every time I make a change. I need it to be responsive so it looks good on phones and desktops. The implementation should prioritize clean design and fast performance. Extensibility for adding a blog section or linking to social profiles would be valuable.","questions":[{"id":"Q4","question":"How should the site's color scheme be determined?","options":[{"label":"A","text":"A monochromatic palette with one accent color"},{"label":"B","text":"A two- or three-color brand palette chosen upfront"},{"label":"C","text":"Match colors to an existing personal brand or logo"},{"label":"D","text":"Use a muted neutral base with project images providing the color"}]},{"id":"Q12","question":"Should a downloadable resume or CV be available?","options":[{"label":"A","text":"Yes, prominently linked in the about section and navigation"},{"label":"B","text":"Yes, but only available behind a simple contact form or email exchange"},{"label":"C","text":"No, the site itself serves as the resume"},{"label":"D","text":"Yes, but auto-generated from the site's own content"}]},{"id":"Q14","question":"How should the projects section display project entries?","options":[{"label":"A","text":"A grid of thumbnail cards with title and short description"},{"label":"B","text":"A list layout with full descriptions"},{"label":"C","text":"A filterable/sortable gallery with tags"},{"label":"D","text":"A carousel or slider"}]},{"id":"Q15","question":"How detailed should each project entry be?","options":[{"label":"A","text":"Title, thumbnail, one-line description, and external link only"},{"label":"B","text":"A dedicated detail page per project with problem, solution, process, and screenshots"},{"label":"C","text":"An expandable card that reveals more detail inline"},{"label":"D","text":"A modal/lightbox overlay with project details"}]},{"id":"Q18","question":"Should projects include links to live demos or deployed versions?","options":[{"label":"A","text":"Yes, always when available"},{"label":"B","text":"Yes, but embedded as interactive previews or screenshots of the live version"},{"label":"C","text":"Only include links to stable, long-lived projects"},{"label":"D","text":"No live links; use screenshots and descriptions instead"}]},{"id":"Q29","question":"Should the contact form send a confirmation to the visitor after submission?","options":[{"label":"A","text":"Yes, an auto-reply email confirming receipt"},{"label":"B","text":"Yes, an on-page success message only"},{"label":"C","text":"No confirmation beyond the form clearing"},{"label":"D","text":"Yes, with an on-page message and an estimated response time"}]},{"id":"Q32","question":"Should the site include a blog section?","options":[{"label":"A","text":"Yes, built-in from the start"},{"label":"B","text":"Yes, but as a linked external blog (e.g., Medium, Dev.to, Hashnode)"},{"label":"C","text":"Not at launch, but design the site so a blog can be added later"},{"label":"D","text":"No blog"}]},{"id":"Q36","question":"If a blog is included, should it have an RSS feed?","options":[{"label":"A","text":"Yes"},{"label":"B","text":"No"},{"label":"C","text":"Yes, but also offer email newsletter signup"}]},{"id":"Q55","question":"Should the site include a \"Skip to content\" or accessibility toolbar?","options":[{"label":"A","text":"A \"Skip to content\" link (hidden until focused)"},{"label":"B","text":"A visible accessibility toolbar with font size, contrast, and motion controls"},{"label":"C","text":"Neither"}]},{"id":"Q70","question":"Should the site include a \"What I'm working on now\" or current status section?","options":[{"label":"A","text":"Yes, a prominent \"Now\" section on the homepage"},{"label":"B","text":"Yes, but as a small status indicator or banner"},{"label":"C","text":"No, your projects and blog posts convey recency"},{"label":"D","text":"Yes, auto-populated from a social feed or GitHub activity"}]}]},"personal-mobileapp":{"label":"Expense Tracker App","proposal":"I want to build a cross-platform mobile app for tracking daily expenses. It should work on both iOS and Android from a single codebase. I need to be able to quickly log expenses with a category, amount, and optional note, and then see breakdowns by category, week, or month in simple charts.\n\nI'd like features like recurring expense tracking, budget limits with notifications when I'm close, and the ability to export my data as CSV. A clean, minimal interface is important -- I want logging an expense to take under five seconds. Cloud sync so I don't lose data if I switch phones would be ideal.","questions":[{"id":"Q4","question":"How should the user enter the expense amount?","options":[{"label":"A","text":"A custom numeric keypad built into the add screen"},{"label":"B","text":"A standard text field that opens the system number keyboard"},{"label":"C","text":"A calculator-style keypad that supports basic math (e.g., \"12.50 + 3.00\")"},{"label":"D","text":"A scrollable wheel/picker for dollars and cents"}]},{"id":"Q5","question":"How should the user select a category when logging an expense?","options":[{"label":"A","text":"A grid of icons with labels"},{"label":"B","text":"A scrollable list with search"},{"label":"C","text":"A text field with autocomplete suggestions"},{"label":"D","text":"An intelligent default based on time of day, location, or recent history, with one tap to change"}]},{"id":"Q12","question":"Should categories support subcategories or hierarchy?","options":[{"label":"A","text":"Yes, one level of subcategories (e.g., Food \u2192 Groceries, Dining Out)"},{"label":"B","text":"Yes, unlimited nesting depth"},{"label":"C","text":"No, keep categories flat"},{"label":"D","text":"No subcategories, but allow tags that can be added to any expense for cross-cutting grouping"}]},{"id":"Q26","question":"How should recurring expenses be set up?","options":[{"label":"A","text":"A dedicated \"recurring expenses\" section in settings where users define them"},{"label":"B","text":"An option on the add-expense screen to mark any expense as recurring"},{"label":"C","text":"Both: add from the expense screen or from a dedicated management section"},{"label":"D","text":"A setup wizard that walks through common recurring expenses (rent, subscriptions, utilities)"}]},{"id":"Q28","question":"When should recurring expenses appear in the log?","options":[{"label":"A","text":"Automatically added on their due date with no user action"},{"label":"B","text":"Automatically added but flagged for review, with a swipe to confirm or edit"},{"label":"C","text":"Sent as a notification reminder; the user manually confirms to add"},{"label":"D","text":"Pre-populated in future dates as \"upcoming\" entries that auto-confirm if not edited"}]},{"id":"Q30","question":"How should budget limits be structured?","options":[{"label":"A","text":"One overall monthly budget"},{"label":"B","text":"Per-category monthly budgets"},{"label":"C","text":"Both an overall monthly budget and optional per-category budgets"},{"label":"D","text":"A single overall budget that dynamically shows a recommended per-category breakdown based on history"}]},{"id":"Q65","question":"How should notifications be managed across the app?","options":[{"label":"A","text":"All notifications on by default; users disable what they don't want"},{"label":"B","text":"All notifications off by default; users enable what they want"},{"label":"C","text":"Budget alerts on by default, everything else opt-in"},{"label":"D","text":"A single \"notification level\" setting: Off / Essential / All"}]},{"id":"Q70","question":"How should the settings screen be organized?","options":[{"label":"A","text":"A flat list of all settings"},{"label":"B","text":"Grouped into sections (Account, Budget, Notifications, Data, Appearance)"},{"label":"C","text":"Only the most common settings visible, with an \"Advanced\" section for the rest"},{"label":"D","text":"A search bar at the top of settings"}]},{"id":"Q72","question":"Should the app provide any end-of-month summary or report?","options":[{"label":"A","text":"Yes, an automatic push notification with a visual monthly summary"},{"label":"B","text":"Yes, a generated report available in-app at month's end"},{"label":"C","text":"Yes, both a notification and a detailed in-app report"},{"label":"D","text":"No, the dashboard and charts serve this purpose"}]},{"id":"Q79","question":"How should the app handle currency symbol placement and number formatting?","options":[{"label":"A","text":"Automatically based on the device's locale"},{"label":"B","text":"User selects their country/locale during setup"},{"label":"C","text":"User configures currency symbol, decimal separator, and thousands separator individually"},{"label":"D","text":"Auto-detect from locale with an option to override in settings"}]}]},"personal-finance":{"label":"Personal Finance Dashboard","proposal":"I want to build a personal finance dashboard that gives me a clear picture of where my money is going. I need to connect my bank accounts or import transaction data and see it categorized automatically -- things like groceries, rent, subscriptions, dining out. I want charts showing spending trends over time and the ability to set monthly budgets per category.\n\nI'd also like a net worth tracker that pulls in my savings and investment accounts, plus a simple forecast feature that projects my savings rate. The dashboard should be web-based, secure, and something I can check daily. Alerts when I exceed a budget or when an unusual transaction appears would be very useful.","questions":[{"id":"Q1","question":"How should transaction data get into the dashboard?","options":[{"label":"A","text":"Direct bank connections only"},{"label":"B","text":"Manual file import only (CSV, OFX, QIF)"},{"label":"C","text":"Both direct connections and manual import"},{"label":"D","text":"Manual entry only, transaction by transaction"}]},{"id":"Q21","question":"How should budget-exceeded alerts be delivered?","options":[{"label":"A","text":"Email only"},{"label":"B","text":"In-app notification only"},{"label":"C","text":"Push notification to mobile browser or device"},{"label":"D","text":"User chooses from email, in-app, and/or push"},{"label":"E","text":"SMS text message"}]},{"id":"Q29","question":"How much historical transaction data should be imported when an account is first connected?","options":[{"label":"A","text":"Last 30 days"},{"label":"B","text":"Last 90 days"},{"label":"C","text":"Last 12 months"},{"label":"D","text":"As much as the bank provides (often 2\u20135 years)"}]},{"id":"Q36","question":"How should the dashboard handle pending (uncleared) transactions?","options":[{"label":"A","text":"Show them inline with a \"pending\" badge"},{"label":"B","text":"Show them in a separate \"pending\" section"},{"label":"C","text":"Hide pending transactions until they clear"},{"label":"D","text":"Include pending amounts in budget calculations but visually distinguish them"}]},{"id":"Q44","question":"Should the dashboard support financial goal setting beyond budgets?","options":[{"label":"A","text":"Yes, savings goals with target amounts and deadlines (e.g., \"Save $5,000 for vacation by June\")"},{"label":"B","text":"Yes, simple milestone markers on the net worth chart"},{"label":"C","text":"No, keep the focus on budgets and tracking"},{"label":"D","text":"Yes, with automated savings recommendations based on goals"}]},{"id":"Q54","question":"How should the dashboard handle duplicate transactions (e.g., same charge appearing from checking and credit card views)?","options":[{"label":"A","text":"Automatically detect and merge likely duplicates"},{"label":"B","text":"Flag potential duplicates for user review"},{"label":"C","text":"Show all transactions as-is and let the user manually hide duplicates"},{"label":"D","text":"Prevent duplicates by only importing from one side of a transfer"}]},{"id":"Q55","question":"Should users be able to set different budgets for different months?","options":[{"label":"A","text":"Yes, each month can have its own budget per category"},{"label":"B","text":"No, one budget applies to every month"},{"label":"C","text":"A default monthly budget with the ability to override specific months"},{"label":"D","text":"Quarterly or seasonal budgets instead of monthly"}]},{"id":"Q58","question":"How much white space and visual density should the dashboard have?","options":[{"label":"A","text":"Spacious layout with generous padding"},{"label":"B","text":"Dense, information-rich layout"},{"label":"C","text":"Adaptive density that starts spacious and lets users toggle to a compact mode"},{"label":"D","text":"Card-based layout with moderate spacing"}]},{"id":"Q76","question":"Should there be a way to annotate or journal about financial decisions alongside the data?","options":[{"label":"A","text":"Yes, a simple monthly notes field for financial reflections"},{"label":"B","text":"Yes, attached to specific transactions or budget periods"},{"label":"C","text":"No, the dashboard is for data, not journaling"},{"label":"D","text":"A separate \"financial journal\" section linked to time periods"}]},{"id":"Q77","question":"How should the dashboard handle data deletion if the user wants to close their account?","options":[{"label":"A","text":"Immediate, complete deletion of all data with confirmation"},{"label":"B","text":"Soft delete with a 30-day grace period before permanent removal"},{"label":"C","text":"Delete account but offer a final data export first"},{"label":"D","text":"Delete account and data immediately with a downloadable export available for 7 days"}]}]},"healthcare-telehealth":{"label":"Telehealth Platform","proposal":"I want to build a telehealth platform for video consultations between patients and healthcare providers. The core experience is a virtual waiting room where patients check in, verify their identity and insurance, then join a video call when the provider is ready. During the visit, providers should be able to share their screen, annotate diagrams, and take structured notes.\n\nAfter each visit, the system generates a summary with diagnoses, care instructions, and any prescriptions. I need secure messaging between visits for follow-up questions, prescription refill requests, and sharing lab results or images. The platform should maintain a full visit history with searchable records, support consent and insurance verification workflows, and allow patients to rate their experience and leave feedback for providers.","questions":[{"id":"Q12","question":"Should annotations made during the visit be saved?","options":[{"label":"A","text":"Yes, automatically saved and attached to the visit record"},{"label":"B","text":"Yes, but only if the provider explicitly chooses to save"},{"label":"C","text":"No, annotations are ephemeral and disappear after the call"},{"label":"D","text":"Saved and included in the post-visit summary sent to the patient"}]},{"id":"Q13","question":"How should structured note-taking work for providers during the visit?","options":[{"label":"A","text":"A standardized SOAP note template (Subjective, Objective, Assessment, Plan)"},{"label":"B","text":"Customizable templates that providers or practices can configure per visit type"},{"label":"C","text":"Free-form rich text with optional structured fields"},{"label":"D","text":"AI-assisted transcription that auto-populates structured fields from the conversation"}]},{"id":"Q14","question":"Should the provider's note-taking interface be visible to the patient during the visit?","options":[{"label":"A","text":"No, notes are completely private to the provider during the visit"},{"label":"B","text":"Yes, a shared view where both see what's being written in real time"},{"label":"C","text":"The provider can selectively share specific sections (e.g., care plan) while keeping others private"},{"label":"D","text":"Notes are hidden during the visit but shared in the post-visit summary"}]},{"id":"Q20","question":"How should prescriptions be handled in the post-visit summary?","options":[{"label":"A","text":"Display prescription details for the patient to take to any pharmacy"},{"label":"B","text":"Integrate with e-prescribing to send directly to the patient's preferred pharmacy"},{"label":"C","text":"Provide a downloadable/printable prescription document"},{"label":"D","text":"List prescriptions with a \"request refill\" button for future use"}]},{"id":"Q28","question":"How should the visit history be organized for patients?","options":[{"label":"A","text":"A simple chronological list of all past visits"},{"label":"B","text":"Chronological list with filters by provider, date range, and visit type"},{"label":"C","text":"Grouped by condition or treatment episode"},{"label":"D","text":"A timeline view with visual indicators for visits, messages, prescriptions, and lab results"}]},{"id":"Q34","question":"Should video visits be recorded?","options":[{"label":"A","text":"Yes, always recorded for medical and legal documentation"},{"label":"B","text":"Yes, but only with explicit consent from both parties before the call starts"},{"label":"C","text":"No, visits are never recorded; structured notes serve as the record"},{"label":"D","text":"Optional: the provider can choose to record specific visits with patient consent"}]},{"id":"Q44","question":"Should patients be able to choose a specific provider, or be matched automatically?","options":[{"label":"A","text":"Patients always choose their provider from a directory"},{"label":"B","text":"System matches patients to providers based on availability, specialty, and preferences"},{"label":"C","text":"Patients can choose a preferred provider or opt for \"next available\""},{"label":"D","text":"Patients are assigned a primary provider but can request others"}]},{"id":"Q45","question":"What information should patients see about a provider before booking?","options":[{"label":"A","text":"Name, photo, specialty, and availability only"},{"label":"B","text":"Name, photo, specialty, bio, credentials, and languages spoken"},{"label":"C","text":"Everything in (B) plus patient ratings and reviews"},{"label":"D","text":"A short profile card with key details and a \"Learn more\" expandable section"}]},{"id":"Q46","question":"How should appointment reminders be delivered?","options":[{"label":"A","text":"Email only"},{"label":"B","text":"Push notification only"},{"label":"C","text":"SMS and email at configurable intervals"},{"label":"D","text":"Patient chooses their preferred reminder channel and timing"}]},{"id":"Q49","question":"Should the platform support walk-in or urgent-care-style visits without prior scheduling?","options":[{"label":"A","text":"Yes, as a core feature with a real-time queue"},{"label":"B","text":"Yes, but only during designated \"open hours\" set by providers"},{"label":"C","text":"No, all visits must be scheduled in advance"},{"label":"D","text":"Yes, with automatic triage questions to determine urgency before joining the queue"}]}]},"startup-scheduling":{"label":"Scheduling Platform","proposal":"My startup is building an online appointment scheduling platform for service businesses like salons, clinics, and consultants. Customers should be able to browse available time slots, book appointments, and receive confirmation and reminder notifications. Each business gets its own booking page with customizable services, durations, and pricing.\n\nI need calendar sync so providers don't get double-booked, support for multiple staff members with different schedules, and a simple dashboard showing upcoming bookings and revenue. We're planning to monetize with a freemium model and need to ship an MVP fast to onboard our first 50 beta customers. Eventually I want to add payment processing, no-show fees, waitlists, and recurring appointment support, but the core booking flow is the priority right now.","questions":[{"id":"Q6","question":"What information should be required from the customer to complete a booking?","options":[{"label":"A","text":"Name and email only"},{"label":"B","text":"Name, email, and phone number"},{"label":"C","text":"Let each business configure which fields are required vs. optional"},{"label":"D","text":"Name, email, and a free-text notes field"}]},{"id":"Q11","question":"How should the booking confirmation be delivered?","options":[{"label":"A","text":"Email only"},{"label":"B","text":"Email and SMS"},{"label":"C","text":"Email plus an in-app notification if the customer has an account"},{"label":"D","text":"Let the business choose which channels to use"}]},{"id":"Q16","question":"How should calendar sync work to prevent double-booking?","options":[{"label":"A","text":"One-way sync: import the provider's external calendar to block those times"},{"label":"B","text":"Two-way sync: import external events and export new bookings"},{"label":"C","text":"Manual availability: providers set their own hours and block times manually"}]},{"id":"Q25","question":"How should service durations be configured?","options":[{"label":"A","text":"Fixed durations only (e.g., 60 min)"},{"label":"B","text":"Fixed durations with a padding option (e.g., 60 min service + 15 min cleanup)"},{"label":"C","text":"Duration ranges (e.g., 45\u201375 min)"},{"label":"D","text":"Multiple duration options per service (e.g., 30 min/$30 or 60 min/$50)"}]},{"id":"Q38","question":"Should customers be able to reschedule their own appointments?","options":[{"label":"A","text":"Yes, self-service rescheduling with the same rules as cancellation"},{"label":"B","text":"Yes, but limited to one reschedule per booking"},{"label":"C","text":"No, rescheduling requires contacting the business"},{"label":"D","text":"Yes, unrestricted rescheduling"}]},{"id":"Q47","question":"How should the mobile experience be handled for customers?","options":[{"label":"A","text":"A responsive web app that works on all screen sizes"},{"label":"B","text":"A responsive web app plus a native mobile app"},{"label":"C","text":"Mobile-first web design with progressive web app (PWA) capabilities"},{"label":"D","text":"A responsive web app for now, with native apps planned for later"}]},{"id":"Q49","question":"Should the platform support multiple locations for a single business?","options":[{"label":"A","text":"Yes, each location has its own booking page, staff, and services"},{"label":"B","text":"No, one location per business account"},{"label":"C","text":"Not in MVP, but plan the architecture for it"}]},{"id":"Q59","question":"How should customer data privacy be handled?","options":[{"label":"A","text":"Customers can request deletion of their data via an in-app link"},{"label":"B","text":"Customer data is automatically purged after a configurable inactivity period"},{"label":"C","text":"Customers' data is visible only to the business they booked with, with clear privacy policy"},{"label":"D","text":"Full customer data portability: customers can download and delete all their data"}]},{"id":"Q69","question":"Should the platform include analytics beyond revenue (e.g., popular times, booking conversion rate)?","options":[{"label":"A","text":"Yes, a full analytics page with charts: popular times, busiest days, conversion rate, cancellation rate"},{"label":"B","text":"Yes, but only a few key metrics: top services, busiest day, cancellation rate"},{"label":"C","text":"No analytics beyond the revenue dashboard in MVP"},{"label":"D","text":"Integrate with external analytics tools (e.g., Google Analytics)"}]},{"id":"Q71","question":"How should beta customer feedback be collected?","options":[{"label":"A","text":"An in-app feedback widget accessible from every page"},{"label":"B","text":"Regular structured surveys (e.g., weekly or bi-weekly)"},{"label":"C","text":"A shared feedback board where businesses can submit and upvote ideas"},{"label":"D","text":"Direct 1:1 conversations (calls, messages)"}]}]}};

// Paste your Google Apps Script web app URL here (see google_apps_script.js for setup).
// Leave empty for local testing — responses will download as JSON files instead.
const SUBMIT_ENDPOINT = "";

const state = {
  participantId: crypto.randomUUID(),
  startTime: Date.now(),
  traits: {},
  project: null,
  answers: [],
  openResponse: "",
};

const projectKeys = Object.keys(STUDY_DATA);
state.project = projectKeys[Math.floor(Math.random() * projectKeys.length)];
const proj = STUDY_DATA[state.project];

const SCREENS = [];

function addScreen(id, html) {
  SCREENS.push({ id, html });
}

addScreen("consent", `
  <h1>Software Design Preferences Study</h1>
  <p>Answer questions about your preferences when planning a software project. Takes about <strong>3–4 minutes</strong>.</p>
  <p style="font-size:0.9rem; color:#868e96;">Responses are anonymous and used for academic research. You may exit at any time.</p>
  <div class="btn-row"><button class="btn" onclick="nextScreen()">Start</button></div>
`);

addScreen("traits", `
  <h2>About You</h2>

  <div class="question-block">
    <div class="question-counter">Question 1 of 5</div>
    <h3>Which best describes your experience with building software or digital products?</h3>
    <label class="option" onclick="selectTrait(this,'experience','beginner')"><span class="option-label">I'm new to this / learning</span></label>
    <label class="option" onclick="selectTrait(this,'experience','junior')"><span class="option-label">I've built a few things but still developing skills</span></label>
    <label class="option" onclick="selectTrait(this,'experience','pm_founder')"><span class="option-label">I lead product decisions / define what gets built</span></label>
    <label class="option" onclick="selectTrait(this,'experience','senior_engineer')"><span class="option-label">I've shipped and maintained production systems for years</span></label>
    <label class="option" onclick="selectTrait(this,'experience','designer')"><span class="option-label">I focus on how things look and feel for users</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 2 of 5</div>
    <h3>When planning a new app, what matters most to you?</h3>
    <label class="option" onclick="selectTrait(this,'priorities','privacy_first')"><span class="option-label">Keeping my data private and secure</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','speed_simplicity')"><span class="option-label">Making it simple and fast to use</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','feature_rich')"><span class="option-label">Packing in powerful features</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','low_cost')"><span class="option-label">Keeping costs low</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 3 of 5</div>
    <h3>When someone asks for your input on design decisions, you tend to...</h3>
    <label class="option" onclick="selectTrait(this,'engagement','highly_engaged')"><span class="option-label">Give detailed feedback and push back on things I disagree with</span></label>
    <label class="option" onclick="selectTrait(this,'engagement','moderately_engaged')"><span class="option-label">Give reasonable input but don't overthink it</span></label>
    <label class="option" onclick="selectTrait(this,'engagement','passive')"><span class="option-label">Go with whatever seems fine, I trust the builder</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 4 of 5</div>
    <h3>When you start a project, how clear is your vision?</h3>
    <label class="option" onclick="selectTrait(this,'goal_clarity','clear_target')"><span class="option-label">I know exactly what I want</span></label>
    <label class="option" onclick="selectTrait(this,'goal_clarity','problem_first')"><span class="option-label">I know the problem but I'm flexible on the solution</span></label>
    <label class="option" onclick="selectTrait(this,'goal_clarity','exploratory')"><span class="option-label">I'm exploring &mdash; I'll figure it out as I go</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 5 of 5</div>
    <h3>How do you prefer to work with tools or assistants?</h3>
    <label class="option" onclick="selectTrait(this,'collaboration','solo_worker')"><span class="option-label">I work best alone, just give me the tools</span></label>
    <label class="option" onclick="selectTrait(this,'collaboration','small_group')"><span class="option-label">I like collaborating with a small team or partner</span></label>
    <label class="option" onclick="selectTrait(this,'collaboration','large_group')"><span class="option-label">I'm used to coordinating across many people</span></label>
  </div>

  <div id="traits-error" class="error-msg">Please answer all 5 questions before continuing.</div>
  <div class="btn-row"><button class="btn" onclick="validateTraits()">Continue</button></div>
`);

let questionsHtml = `
  <h2>Design Preferences</h2>
  <p>You're planning to build this project. How would you design it?</p>
  <div class="proposal-box">${proj.proposal}</div>
  <p class="note">Skip any question you don't have a preference on.</p>
`;
proj.questions.forEach((q, i) => {
  let optsHtml = q.options.map(o => `
    <label class="option" onclick="selectAnswer(this,'${q.id}','${o.label}')">
      <span class="option-label"><strong>${o.label}.</strong> ${o.text}</span>
    </label>
  `).join("");
  questionsHtml += `
    <div class="question-block">
      <div class="question-counter">Question ${i+1} of ${proj.questions.length}</div>
      <h3>${q.question}</h3>
      ${optsHtml}
    </div>
  `;
});
questionsHtml += `
  <div class="btn-row"><button class="btn" onclick="nextScreen()">Continue</button></div>
`;
addScreen("questions", questionsHtml);

addScreen("open", `
  <h2>One Last Thing</h2>
  <p>If an AI were helping you plan this project, what's the first question it should ask you?</p>
  <textarea id="open-response" placeholder="Optional"></textarea>
  <div class="btn-row"><button class="btn" onclick="submitStudy()">Submit</button></div>
`);

addScreen("thanks", `
  <h1>Thank you!</h1>
  <p>Your responses have been recorded. Here is your completion code:</p>
  <div class="completion-code" id="completion-code"></div>
  <p class="note">Please copy this code and paste it back in Prolific to confirm your participation.</p>
`);

let currentScreen = 0;

function render() {
  const container = document.getElementById("screens");
  container.innerHTML = SCREENS.map((s, i) =>
    `<div class="screen ${i === currentScreen ? "active" : ""}" id="screen-${s.id}">${s.html}</div>`
  ).join("");
  const pct = (currentScreen / (SCREENS.length - 1)) * 100;
  document.getElementById("progress").style.width = pct + "%";
  window.scrollTo(0, 0);
}

function nextScreen() {
  currentScreen++;
  render();
}

function selectTrait(el, dim, val) {
  const block = el.closest(".question-block");
  block.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.traits[dim] = val;
}

function selectAnswer(el, qid, choice) {
  const block = el.closest(".question-block");
  block.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  const existing = state.answers.find(a => a.question_id === qid);
  if (existing) existing.choice = choice;
  else state.answers.push({ question_id: qid, choice });
}

function validateTraits() {
  const dims = ["experience", "priorities", "engagement", "goal_clarity", "collaboration"];
  const missing = dims.filter(d => !state.traits[d]);
  const err = document.getElementById("traits-error");
  if (missing.length > 0) {
    err.style.display = "block";
    return;
  }
  err.style.display = "none";
  nextScreen();
}

function submitStudy() {
  state.openResponse = document.getElementById("open-response").value;
  state.endTime = Date.now();
  state.durationSeconds = Math.round((state.endTime - state.startTime) / 1000);

  const payload = {
    participant_id: state.participantId,
    timestamp: new Date().toISOString(),
    duration_seconds: state.durationSeconds,
    traits: state.traits,
    project: state.project,
    answers: state.answers,
    open_response: state.openResponse,
  };

  const code = "SPEC-" + state.participantId.slice(0, 8).toUpperCase();

  if (SUBMIT_ENDPOINT) {
    fetch(SUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `response_${state.participantId.slice(0,8)}.json`;
  a.click();

  nextScreen();
  document.getElementById("completion-code").textContent = code;
}

render();
</script>
