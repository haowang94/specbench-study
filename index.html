<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software Design Preferences Study</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #212529; line-height: 1.6; }
.container { max-width: 680px; margin: 0 auto; padding: 24px 20px; min-height: 100vh; }
.progress-bar { background: #e9ecef; border-radius: 8px; height: 6px; margin-bottom: 32px; overflow: hidden; }
.progress-fill { background: #4263eb; height: 100%; border-radius: 8px; transition: width 0.3s ease; }
.screen { display: none; }
.screen.active { display: block; }
h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; color: #495057; }
p { margin-bottom: 16px; color: #495057; }
.proposal-box { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px; margin-bottom: 24px; font-style: italic; color: #495057; }
.question-block { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.question-block h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
.question-counter { font-size: 0.8rem; color: #868e96; margin-bottom: 4px; }
.option { display: block; padding: 10px 14px; margin-bottom: 6px; border: 2px solid #e9ecef; border-radius: 6px; cursor: pointer; transition: all 0.15s; font-size: 0.95rem; }
.option:hover { border-color: #4263eb; background: #f0f3ff; }
.option.selected { border-color: #4263eb; background: #e8ecff; }
.option input { display: none; }
.option-label { display: inline; }
.btn { display: inline-block; padding: 12px 32px; background: #4263eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: #3b5bdb; }
.btn:disabled { background: #adb5bd; cursor: not-allowed; }
.btn-row { margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px; }
textarea { width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 6px; font-family: inherit; font-size: 0.95rem; resize: vertical; min-height: 80px; }
textarea:focus { outline: none; border-color: #4263eb; }
.completion-code { background: #d3f9d8; border: 1px solid #69db7c; border-radius: 8px; padding: 16px; text-align: center; font-size: 1.2rem; font-weight: 600; font-family: monospace; margin: 24px 0; }
.note { font-size: 0.85rem; color: #868e96; margin-top: 8px; }
.required { color: #e03131; }
.error-msg { color: #e03131; font-size: 0.85rem; margin-top: 4px; display: none; }
@media (max-width: 600px) {
  .container { padding: 16px 12px; }
}
</style>
</head>
<body>
<div class="container">
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
<div id="screens"></div>
</div>

<script>
const STUDY_DATA = {"personal-website":{"label":"Personal Website","proposal":"I want to build a personal website that I can use to showcase my work, share a bit about myself, and give people a way to get in touch. It should look polished and professional, with sections for my projects, skills, and a contact form. I'd like it to be easy to update without needing to redeploy every time I make a change. I need it to be responsive so it looks good on phones and desktops. The implementation should prioritize clean design and fast performance. Extensibility for adding a blog section or linking to social profiles would be valuable.","questions":[{"id":"Q4","question":"How should the site's color scheme be determined?","options":[{"label":"A","text":"A monochromatic palette with one accent color"},{"label":"B","text":"A two- or three-color brand palette chosen upfront"},{"label":"C","text":"Match colors to an existing personal brand or logo"},{"label":"D","text":"Use a muted neutral base with project images providing the color"}]},{"id":"Q12","question":"Should a downloadable resume or CV be available?","options":[{"label":"A","text":"Yes, prominently linked in the about section and navigation"},{"label":"B","text":"Yes, but only available behind a simple contact form or email exchange"},{"label":"C","text":"No, the site itself serves as the resume"},{"label":"D","text":"Yes, but auto-generated from the site's own content"}]},{"id":"Q14","question":"How should the projects section display project entries?","options":[{"label":"A","text":"A grid of thumbnail cards with title and short description"},{"label":"B","text":"A list layout with full descriptions"},{"label":"C","text":"A filterable/sortable gallery with tags"},{"label":"D","text":"A carousel or slider"}]},{"id":"Q15","question":"How detailed should each project entry be?","options":[{"label":"A","text":"Title, thumbnail, one-line description, and external link only"},{"label":"B","text":"A dedicated detail page per project with problem, solution, process, and screenshots"},{"label":"C","text":"An expandable card that reveals more detail inline"},{"label":"D","text":"A modal/lightbox overlay with project details"}]},{"id":"Q18","question":"Should projects include links to live demos or deployed versions?","options":[{"label":"A","text":"Yes, always when available"},{"label":"B","text":"Yes, but embedded as interactive previews or screenshots of the live version"},{"label":"C","text":"Only include links to stable, long-lived projects"},{"label":"D","text":"No live links; use screenshots and descriptions instead"}]},{"id":"Q29","question":"Should the contact form send a confirmation to the visitor after submission?","options":[{"label":"A","text":"Yes, an auto-reply email confirming receipt"},{"label":"B","text":"Yes, an on-page success message only"},{"label":"C","text":"No confirmation beyond the form clearing"},{"label":"D","text":"Yes, with an on-page message and an estimated response time"}]},{"id":"Q32","question":"Should the site include a blog section?","options":[{"label":"A","text":"Yes, built-in from the start"},{"label":"B","text":"Yes, but as a linked external blog (e.g., Medium, Dev.to, Hashnode)"},{"label":"C","text":"Not at launch, but design the site so a blog can be added later"},{"label":"D","text":"No blog"}]},{"id":"Q36","question":"If a blog is included, should it have an RSS feed?","options":[{"label":"A","text":"Yes"},{"label":"B","text":"No"},{"label":"C","text":"Yes, but also offer email newsletter signup"}]},{"id":"Q55","question":"Should the site include a \"Skip to content\" or accessibility toolbar?","options":[{"label":"A","text":"A \"Skip to content\" link (hidden until focused)"},{"label":"B","text":"A visible accessibility toolbar with font size, contrast, and motion controls"},{"label":"C","text":"Neither"}]},{"id":"Q70","question":"Should the site include a \"What I'm working on now\" or current status section?","options":[{"label":"A","text":"Yes, a prominent \"Now\" section on the homepage"},{"label":"B","text":"Yes, but as a small status indicator or banner"},{"label":"C","text":"No, your projects and blog posts convey recency"},{"label":"D","text":"Yes, auto-populated from a social feed or GitHub activity"}]}]},"personal-mealplanner":{"label":"Meal Planner App","proposal":"I want to build a recipe and meal planning app. I need a place to save and organize my recipes with ingredients, steps, cook time, and photos. From there, I want to plan out my meals for the week on a calendar view and have it automatically generate a consolidated grocery list based on what I've planned.\n\nI'd like to search and filter recipes by dietary tags, cuisine type, or prep time. Scaling recipes for different serving sizes and tracking basic nutritional info per meal would be really helpful. Bonus if I can share recipes with family or friends and import recipes from URLs. The interface should be clean and usable on my phone while I'm actually cooking.","questions":[{"id":"Q4","question":"How detailed should recipe steps be?","options":[{"label":"A","text":"A single free-text block for all instructions"},{"label":"B","text":"Numbered steps, each entered as a separate text field"},{"label":"C","text":"Numbered steps with optional per-step photos or timers"},{"label":"D","text":"Numbered steps with the ability to link specific ingredients to each step"}]},{"id":"Q5","question":"How should cook time and prep time be captured?","options":[{"label":"A","text":"A single \"total time\" field"},{"label":"B","text":"Separate prep time and cook time fields, with total calculated automatically"},{"label":"C","text":"Prep time, active cook time, and passive time (e.g., marinating, resting)"},{"label":"D","text":"Optional time fields that the user can skip entirely"}]},{"id":"Q12","question":"Should the meal plan allow non-recipe entries?","options":[{"label":"A","text":"No, only saved recipes can be planned"},{"label":"B","text":"Yes, allow free-text meal entries alongside recipes"},{"label":"C","text":"Yes, with special quick-entry types like \"eating out,\" \"leftovers,\" or \"skip\""},{"label":"D","text":"Yes, free-text entries with optional ingredient attachment"}]},{"id":"Q26","question":"How should recipe sharing with family and friends work?","options":[{"label":"A","text":"Generate a shareable link that anyone can view without an account"},{"label":"B","text":"Share to specific users within the app who must have accounts"},{"label":"C","text":"Export as a formatted PDF or image the user can send via any channel"},{"label":"D","text":"Both shareable links and in-app sharing to registered users"}]},{"id":"Q28","question":"Should shared recipes be editable by recipients?","options":[{"label":"A","text":"No, shared recipes are read-only"},{"label":"B","text":"Yes, recipients get a full copy they can edit independently"},{"label":"C","text":"Recipients can save their own copy and edit that, while the original remains linked for reference"},{"label":"D","text":"Recipients can suggest edits that the author approves"}]},{"id":"Q30","question":"What should happen when URL import fails to extract some recipe data?","options":[{"label":"A","text":"Import what was extracted and leave missing fields blank for the user to fill in"},{"label":"B","text":"Show a clear error report of what couldn't be extracted and prompt the user to complete it"},{"label":"C","text":"Reject the import entirely and ask the user to enter the recipe manually"},{"label":"D","text":"Import what was extracted and flag incomplete fields with a visual indicator"}]},{"id":"Q65","question":"How should the app handle measurement precision in scaling?","options":[{"label":"A","text":"Show exact calculated values (e.g., \"1.333 cups\")"},{"label":"B","text":"Round to common kitchen measurements (e.g., \"1\u2153 cups\")"},{"label":"C","text":"Show practical measurements with the exact value available on tap"},{"label":"D","text":"Round and add a note when significant rounding occurred"}]},{"id":"Q70","question":"How should multi-component recipes be handled (e.g., a dish with a separate sauce recipe)?","options":[{"label":"A","text":"As one recipe with sections (e.g., \"For the sauce,\" \"For the main\")"},{"label":"B","text":"As linked sub-recipes that can exist independently"},{"label":"C","text":"Not supported; users combine everything into one ingredient list and one set of steps"},{"label":"D","text":"Sections within a recipe but with independently scalable components"}]},{"id":"Q72","question":"How should the app handle seasonal or time-limited ingredients?","options":[{"label":"A","text":"No special handling"},{"label":"B","text":"Tag ingredients with seasonal availability and warn when planning off-season"},{"label":"C","text":"Allow users to mark ingredients as \"currently unavailable\" in their area"},{"label":"D","text":"Suggest in-season recipes based on the current month"}]},{"id":"Q79","question":"Should the app include social features beyond recipe sharing?","options":[{"label":"A","text":"No social features; it's a personal productivity tool"},{"label":"B","text":"A lightweight social feed showing what friends or family have cooked"},{"label":"C","text":"The ability to follow other users and browse their public recipe collections"},{"label":"D","text":"Comments or reactions on shared recipes only"}]}]},"personal-finance":{"label":"Personal Finance Tracker","proposal":"I want to build a personal finance dashboard that gives me a clear picture of where my money is going. I need to connect my bank accounts or import transaction data and see it categorized automatically -- things like groceries, rent, subscriptions, dining out. I want charts showing spending trends over time and the ability to set monthly budgets per category.\n\nI'd also like a net worth tracker that pulls in my savings and investment accounts, plus a simple forecast feature that projects my savings rate. The dashboard should be web-based, secure, and something I can check daily. Alerts when I exceed a budget or when an unusual transaction appears would be very useful.","questions":[{"id":"Q1","question":"How should transaction data get into the dashboard?","options":[{"label":"A","text":"Direct bank connections only"},{"label":"B","text":"Manual file import only (CSV, OFX, QIF)"},{"label":"C","text":"Both direct connections and manual import"},{"label":"D","text":"Manual entry only, transaction by transaction"}]},{"id":"Q21","question":"How should budget-exceeded alerts be delivered?","options":[{"label":"A","text":"Email only"},{"label":"B","text":"In-app notification only"},{"label":"C","text":"Push notification to mobile browser or device"},{"label":"D","text":"User chooses from email, in-app, and/or push"},{"label":"E","text":"SMS text message"}]},{"id":"Q29","question":"How much historical transaction data should be imported when an account is first connected?","options":[{"label":"A","text":"Last 30 days"},{"label":"B","text":"Last 90 days"},{"label":"C","text":"Last 12 months"},{"label":"D","text":"As much as the bank provides (often 2\u20135 years)"}]},{"id":"Q36","question":"How should the dashboard handle pending (uncleared) transactions?","options":[{"label":"A","text":"Show them inline with a \"pending\" badge"},{"label":"B","text":"Show them in a separate \"pending\" section"},{"label":"C","text":"Hide pending transactions until they clear"},{"label":"D","text":"Include pending amounts in budget calculations but visually distinguish them"}]},{"id":"Q44","question":"Should the dashboard support financial goal setting beyond budgets?","options":[{"label":"A","text":"Yes, savings goals with target amounts and deadlines (e.g., \"Save $5,000 for vacation by June\")"},{"label":"B","text":"Yes, simple milestone markers on the net worth chart"},{"label":"C","text":"No, keep the focus on budgets and tracking"},{"label":"D","text":"Yes, with automated savings recommendations based on goals"}]},{"id":"Q54","question":"How should the dashboard handle duplicate transactions (e.g., same charge appearing from checking and credit card views)?","options":[{"label":"A","text":"Automatically detect and merge likely duplicates"},{"label":"B","text":"Flag potential duplicates for user review"},{"label":"C","text":"Show all transactions as-is and let the user manually hide duplicates"},{"label":"D","text":"Prevent duplicates by only importing from one side of a transfer"}]},{"id":"Q55","question":"Should users be able to set different budgets for different months?","options":[{"label":"A","text":"Yes, each month can have its own budget per category"},{"label":"B","text":"No, one budget applies to every month"},{"label":"C","text":"A default monthly budget with the ability to override specific months"},{"label":"D","text":"Quarterly or seasonal budgets instead of monthly"}]},{"id":"Q58","question":"How much white space and visual density should the dashboard have?","options":[{"label":"A","text":"Spacious layout with generous padding"},{"label":"B","text":"Dense, information-rich layout"},{"label":"C","text":"Adaptive density that starts spacious and lets users toggle to a compact mode"},{"label":"D","text":"Card-based layout with moderate spacing"}]},{"id":"Q76","question":"Should there be a way to annotate or journal about financial decisions alongside the data?","options":[{"label":"A","text":"Yes, a simple monthly notes field for financial reflections"},{"label":"B","text":"Yes, attached to specific transactions or budget periods"},{"label":"C","text":"No, the dashboard is for data, not journaling"},{"label":"D","text":"A separate \"financial journal\" section linked to time periods"}]},{"id":"Q77","question":"How should the dashboard handle data deletion if the user wants to close their account?","options":[{"label":"A","text":"Immediate, complete deletion of all data with confirmation"},{"label":"B","text":"Soft delete with a 30-day grace period before permanent removal"},{"label":"C","text":"Delete account but offer a final data export first"},{"label":"D","text":"Delete account and data immediately with a downloadable export available for 7 days"}]}]},"personal-healthtracker":{"label":"Health Tracker App","proposal":"I want to build a health and fitness tracking app where I can log workouts, meals, sleep, and body metrics like weight and heart rate. I need to see my progress over time with clear charts and streaks that keep me motivated. Custom goals -- like hitting a step count, drinking enough water, or exercising a certain number of days per week -- should be easy to set up.\n\nI'd like daily reminders and the ability to import data from wearables or health APIs. The interface should be mobile-first since I'll mostly use it on my phone, but a web dashboard for reviewing longer-term trends would be great too. Data privacy matters to me, so I want control over where my health data is stored.","questions":[{"id":"Q12","question":"How detailed should nutritional tracking be?","options":[{"label":"A","text":"Calories only"},{"label":"B","text":"Calories plus macronutrients (protein, carbs, fat)"},{"label":"C","text":"Full nutritional breakdown including micronutrients (vitamins, minerals, fiber)"},{"label":"D","text":"User-configurable: choose which nutrients to track"}]},{"id":"Q13","question":"Should the app support meal planning in addition to meal logging?","options":[{"label":"A","text":"No, logging only"},{"label":"B","text":"Yes, allow users to plan meals for upcoming days and auto-populate the log"},{"label":"C","text":"A simple \"repeat yesterday's meals\" or \"copy meal\" shortcut"},{"label":"D","text":"Integration with external meal planning apps or services"}]},{"id":"Q14","question":"How should the app handle recipes and multi-ingredient meals?","options":[{"label":"A","text":"Users log individual ingredients separately"},{"label":"B","text":"Users can create and save custom recipes with ingredients and serving sizes"},{"label":"C","text":"No recipe support; users estimate and log the total nutritional info"},{"label":"D","text":"AI-assisted recipe breakdown from a description or photo"}]},{"id":"Q20","question":"What body metrics beyond weight should be supported?","options":[{"label":"A","text":"Only weight"},{"label":"B","text":"Weight and heart rate"},{"label":"C","text":"Weight, heart rate, body fat percentage, and basic measurements (waist, hips)"},{"label":"D","text":"A customizable list where users add whatever metrics matter to them (blood pressure, blood glucose, etc.)"}]},{"id":"Q28","question":"What motivational elements beyond streaks should the app include?","options":[{"label":"A","text":"None; let the data speak for itself"},{"label":"B","text":"Achievement badges for milestones (first workout logged, 30-day streak, new PR)"},{"label":"C","text":"Weekly or monthly progress summaries with encouraging messages"},{"label":"D","text":"Leaderboards or social comparisons with friends"},{"label":"E","text":"All of the above, toggleable by the user"}]},{"id":"Q34","question":"Should goals automatically adjust based on user progress?","options":[{"label":"A","text":"No, goals stay as set until the user manually changes them"},{"label":"B","text":"Suggest adjustments when the user consistently exceeds or misses a goal"},{"label":"C","text":"Auto-adjust goals based on recent performance with user approval"},{"label":"D","text":"Offer a \"progressive overload\" mode for fitness goals that automatically increases targets on a schedule"}]},{"id":"Q44","question":"How should the quick-log experience work on mobile?","options":[{"label":"A","text":"A single \"Add\" button that opens a category picker (workout, meal, sleep, metric)"},{"label":"B","text":"Dedicated log buttons on the dashboard for each category"},{"label":"C","text":"A contextual quick-log widget based on time of day (e.g., meal logging in the morning, workout in the evening)"},{"label":"D","text":"A floating action button with a radial menu of logging options"}]},{"id":"Q45","question":"How information-dense should the mobile dashboard be?","options":[{"label":"A","text":"Minimal: current streak, top goal progress, and a log prompt"},{"label":"B","text":"Moderate: today's logged data, goal progress, and streak count"},{"label":"C","text":"Dense: all metrics, goals, streaks, recent activity, and mini-charts on one screen"},{"label":"D","text":"User-customizable: drag-and-drop widgets to build their own dashboard"}]},{"id":"Q46","question":"How should the app handle data entry while the phone is in one-handed use?","options":[{"label":"A","text":"No special accommodation; standard UI placement"},{"label":"B","text":"Place all primary actions and inputs in the bottom half of the screen"},{"label":"C","text":"Support a reachability mode that shifts content down on demand"},{"label":"D","text":"Large, easy-to-tap buttons with generous spacing throughout"}]},{"id":"Q49","question":"How should the web dashboard differ from the mobile app?","options":[{"label":"A","text":"The web dashboard is a read-only analytics view; all logging happens on mobile"},{"label":"B","text":"Full feature parity between web and mobile"},{"label":"C","text":"The web dashboard has everything the mobile app has plus expanded charts and reports"},{"label":"D","text":"The web is a simplified export/report tool for downloading data and generating summaries"}]}]},"startup-scheduling":{"label":"Scheduling Platform","proposal":"My startup is building an online appointment scheduling platform for service businesses like salons, clinics, and consultants. Customers should be able to browse available time slots, book appointments, and receive confirmation and reminder notifications. Each business gets its own booking page with customizable services, durations, and pricing.\n\nI need calendar sync so providers don't get double-booked, support for multiple staff members with different schedules, and a simple dashboard showing upcoming bookings and revenue. We're planning to monetize with a freemium model and need to ship an MVP fast to onboard our first 50 beta customers. Eventually I want to add payment processing, no-show fees, waitlists, and recurring appointment support, but the core booking flow is the priority right now.","questions":[{"id":"Q6","question":"What information should be required from the customer to complete a booking?","options":[{"label":"A","text":"Name and email only"},{"label":"B","text":"Name, email, and phone number"},{"label":"C","text":"Let each business configure which fields are required vs. optional"},{"label":"D","text":"Name, email, and a free-text notes field"}]},{"id":"Q11","question":"How should the booking confirmation be delivered?","options":[{"label":"A","text":"Email only"},{"label":"B","text":"Email and SMS"},{"label":"C","text":"Email plus an in-app notification if the customer has an account"},{"label":"D","text":"Let the business choose which channels to use"}]},{"id":"Q16","question":"How should calendar sync work to prevent double-booking?","options":[{"label":"A","text":"One-way sync: import the provider's external calendar to block those times"},{"label":"B","text":"Two-way sync: import external events and export new bookings"},{"label":"C","text":"Manual availability: providers set their own hours and block times manually"}]},{"id":"Q25","question":"How should service durations be configured?","options":[{"label":"A","text":"Fixed durations only (e.g., 60 min)"},{"label":"B","text":"Fixed durations with a padding option (e.g., 60 min service + 15 min cleanup)"},{"label":"C","text":"Duration ranges (e.g., 45\u201375 min)"},{"label":"D","text":"Multiple duration options per service (e.g., 30 min/$30 or 60 min/$50)"}]},{"id":"Q38","question":"Should customers be able to reschedule their own appointments?","options":[{"label":"A","text":"Yes, self-service rescheduling with the same rules as cancellation"},{"label":"B","text":"Yes, but limited to one reschedule per booking"},{"label":"C","text":"No, rescheduling requires contacting the business"},{"label":"D","text":"Yes, unrestricted rescheduling"}]},{"id":"Q47","question":"How should the mobile experience be handled for customers?","options":[{"label":"A","text":"A responsive web app that works on all screen sizes"},{"label":"B","text":"A responsive web app plus a native mobile app"},{"label":"C","text":"Mobile-first web design with progressive web app (PWA) capabilities"},{"label":"D","text":"A responsive web app for now, with native apps planned for later"}]},{"id":"Q49","question":"Should the platform support multiple locations for a single business?","options":[{"label":"A","text":"Yes, each location has its own booking page, staff, and services"},{"label":"B","text":"No, one location per business account"},{"label":"C","text":"Not in MVP, but plan the architecture for it"}]},{"id":"Q59","question":"How should customer data privacy be handled?","options":[{"label":"A","text":"Customers can request deletion of their data via an in-app link"},{"label":"B","text":"Customer data is automatically purged after a configurable inactivity period"},{"label":"C","text":"Customers' data is visible only to the business they booked with, with clear privacy policy"},{"label":"D","text":"Full customer data portability: customers can download and delete all their data"}]},{"id":"Q69","question":"Should the platform include analytics beyond revenue (e.g., popular times, booking conversion rate)?","options":[{"label":"A","text":"Yes, a full analytics page with charts: popular times, busiest days, conversion rate, cancellation rate"},{"label":"B","text":"Yes, but only a few key metrics: top services, busiest day, cancellation rate"},{"label":"C","text":"No analytics beyond the revenue dashboard in MVP"},{"label":"D","text":"Integrate with external analytics tools (e.g., Google Analytics)"}]},{"id":"Q71","question":"How should beta customer feedback be collected?","options":[{"label":"A","text":"An in-app feedback widget accessible from every page"},{"label":"B","text":"Regular structured surveys (e.g., weekly or bi-weekly)"},{"label":"C","text":"A shared feedback board where businesses can submit and upvote ideas"},{"label":"D","text":"Direct 1:1 conversations (calls, messages)"}]}]}};

// Paste your Google Apps Script web app URL here (see google_apps_script.js for setup).
// Leave empty for local testing — responses will download as JSON files instead.
const SUBMIT_ENDPOINT = "";

const state = {
  participantId: crypto.randomUUID(),
  startTime: Date.now(),
  traits: {},
  project: null,
  answers: [],
  openResponse: "",
};

const projectKeys = Object.keys(STUDY_DATA);
state.project = projectKeys[Math.floor(Math.random() * projectKeys.length)];
const proj = STUDY_DATA[state.project];

const SCREENS = [];

function addScreen(id, html) {
  SCREENS.push({ id, html });
}

addScreen("consent", `
  <h1>Software Design Preferences Study</h1>
  <p>Answer questions about your preferences when planning a software project. Takes about <strong>3–4 minutes</strong>.</p>
  <p style="font-size:0.9rem; color:#868e96;">Responses are anonymous and used for academic research. You may exit at any time.</p>
  <div class="btn-row"><button class="btn" onclick="nextScreen()">Start</button></div>
`);

addScreen("traits", `
  <h2>About You</h2>

  <div class="question-block">
    <div class="question-counter">Question 1 of 5</div>
    <h3>Which best describes your experience with building software or digital products?</h3>
    <label class="option" onclick="selectTrait(this,'experience','beginner')"><span class="option-label">I'm new to this / learning</span></label>
    <label class="option" onclick="selectTrait(this,'experience','junior')"><span class="option-label">I've built a few things but still developing skills</span></label>
    <label class="option" onclick="selectTrait(this,'experience','pm_founder')"><span class="option-label">I lead product decisions / define what gets built</span></label>
    <label class="option" onclick="selectTrait(this,'experience','senior_engineer')"><span class="option-label">I've shipped and maintained production systems for years</span></label>
    <label class="option" onclick="selectTrait(this,'experience','designer')"><span class="option-label">I focus on how things look and feel for users</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 2 of 5</div>
    <h3>When planning a new app, what matters most to you?</h3>
    <label class="option" onclick="selectTrait(this,'priorities','privacy_first')"><span class="option-label">Keeping my data private and secure</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','speed_simplicity')"><span class="option-label">Making it simple and fast to use</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','feature_rich')"><span class="option-label">Packing in powerful features</span></label>
    <label class="option" onclick="selectTrait(this,'priorities','low_cost')"><span class="option-label">Keeping costs low</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 3 of 5</div>
    <h3>When someone asks for your input on design decisions, you tend to...</h3>
    <label class="option" onclick="selectTrait(this,'engagement','highly_engaged')"><span class="option-label">Give detailed feedback and push back on things I disagree with</span></label>
    <label class="option" onclick="selectTrait(this,'engagement','moderately_engaged')"><span class="option-label">Give reasonable input but don't overthink it</span></label>
    <label class="option" onclick="selectTrait(this,'engagement','passive')"><span class="option-label">Go with whatever seems fine, I trust the builder</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 4 of 5</div>
    <h3>When you start a project, how clear is your vision?</h3>
    <label class="option" onclick="selectTrait(this,'goal_clarity','clear_target')"><span class="option-label">I know exactly what I want</span></label>
    <label class="option" onclick="selectTrait(this,'goal_clarity','problem_first')"><span class="option-label">I know the problem but I'm flexible on the solution</span></label>
    <label class="option" onclick="selectTrait(this,'goal_clarity','exploratory')"><span class="option-label">I'm exploring &mdash; I'll figure it out as I go</span></label>
  </div>

  <div class="question-block">
    <div class="question-counter">Question 5 of 5</div>
    <h3>How do you prefer to work with tools or assistants?</h3>
    <label class="option" onclick="selectTrait(this,'collaboration','solo_worker')"><span class="option-label">I work best alone, just give me the tools</span></label>
    <label class="option" onclick="selectTrait(this,'collaboration','small_group')"><span class="option-label">I like collaborating with a small team or partner</span></label>
    <label class="option" onclick="selectTrait(this,'collaboration','large_group')"><span class="option-label">I'm used to coordinating across many people</span></label>
  </div>

  <div id="traits-error" class="error-msg">Please answer all 5 questions before continuing.</div>
  <div class="btn-row"><button class="btn" onclick="validateTraits()">Continue</button></div>
`);

let questionsHtml = `
  <h2>Design Preferences</h2>
  <p>You're planning to build this project. How would you design it?</p>
  <div class="proposal-box">${proj.proposal}</div>
  <p class="note">Skip any question you don't have a preference on.</p>
`;
proj.questions.forEach((q, i) => {
  let optsHtml = q.options.map(o => `
    <label class="option" onclick="selectAnswer(this,'${q.id}','${o.label}')">
      <span class="option-label"><strong>${o.label}.</strong> ${o.text}</span>
    </label>
  `).join("");
  questionsHtml += `
    <div class="question-block">
      <div class="question-counter">Question ${i+1} of ${proj.questions.length}</div>
      <h3>${q.question}</h3>
      ${optsHtml}
    </div>
  `;
});
questionsHtml += `
  <div class="btn-row"><button class="btn" onclick="nextScreen()">Continue</button></div>
`;
addScreen("questions", questionsHtml);

addScreen("open", `
  <h2>One Last Thing</h2>
  <p>If an AI were helping you plan this project, what's the first question it should ask you?</p>
  <textarea id="open-response" placeholder="Optional"></textarea>
  <div class="btn-row"><button class="btn" onclick="submitStudy()">Submit</button></div>
`);

addScreen("thanks", `
  <h1>Thank you!</h1>
  <p>Your responses have been recorded. Here is your completion code:</p>
  <div class="completion-code" id="completion-code"></div>
  <p class="note">Please copy this code and paste it back in Prolific to confirm your participation.</p>
`);

let currentScreen = 0;

function render() {
  const container = document.getElementById("screens");
  container.innerHTML = SCREENS.map((s, i) =>
    `<div class="screen ${i === currentScreen ? "active" : ""}" id="screen-${s.id}">${s.html}</div>`
  ).join("");
  const pct = (currentScreen / (SCREENS.length - 1)) * 100;
  document.getElementById("progress").style.width = pct + "%";
  window.scrollTo(0, 0);
}

function nextScreen() {
  currentScreen++;
  render();
}

function selectTrait(el, dim, val) {
  const block = el.closest(".question-block");
  block.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  state.traits[dim] = val;
}

function selectAnswer(el, qid, choice) {
  const block = el.closest(".question-block");
  block.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  const existing = state.answers.find(a => a.question_id === qid);
  if (existing) existing.choice = choice;
  else state.answers.push({ question_id: qid, choice });
}

function validateTraits() {
  const dims = ["experience", "priorities", "engagement", "goal_clarity", "collaboration"];
  const missing = dims.filter(d => !state.traits[d]);
  const err = document.getElementById("traits-error");
  if (missing.length > 0) {
    err.style.display = "block";
    return;
  }
  err.style.display = "none";
  nextScreen();
}

function submitStudy() {
  state.openResponse = document.getElementById("open-response").value;
  state.endTime = Date.now();
  state.durationSeconds = Math.round((state.endTime - state.startTime) / 1000);

  const payload = {
    participant_id: state.participantId,
    timestamp: new Date().toISOString(),
    duration_seconds: state.durationSeconds,
    traits: state.traits,
    project: state.project,
    answers: state.answers,
    open_response: state.openResponse,
  };

  const code = "SPEC-" + state.participantId.slice(0, 8).toUpperCase();

  if (SUBMIT_ENDPOINT) {
    fetch(SUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `response_${state.participantId.slice(0,8)}.json`;
  a.click();

  nextScreen();
  document.getElementById("completion-code").textContent = code;
}

render();
</script>
